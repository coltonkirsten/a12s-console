name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: dist/ is committed and current (npx github:coltonkirsten/a12s-console runs it as-is)
        run: git diff --stat --exit-code -- dist || (echo "::error::run npm run build and commit dist/"; exit 1)
